name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Read-only: CI only checks out and tests code, it never needs to write to
# the repo (or anything else) with the workflow token.
permissions:
  contents: read

jobs:
  frontend:
    name: Lint, build, and test (Node)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:main
      - run: npm run test:ui

  backend:
    name: Backend lint and tests (Python)
    runs-on: windows-latest
    env:
      # The tests run against the exact ffmpeg build the app ships
      # (npm run fetch:ffmpeg -- pinned version, checksum-verified), not
      # whatever choco/brew currently provides. bin_paths.py reads these;
      # without them it falls back to PATH, where this runner has none.
      FFMPEG_BIN: ${{ github.workspace }}\vendor\ffmpeg\ffmpeg.exe
      FFPROBE_BIN: ${{ github.workspace }}\vendor\ffmpeg\ffprobe.exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # The version the release build is made with (.venv / PyInstaller).
          python-version-file: .python-version
          cache: pip

      # fetch-ffmpeg.mjs only uses Node built-ins -- no npm ci needed.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run fetch:ffmpeg

      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest -q
        working-directory: backend

  frontend-mac:
    name: Lint, build, and test (Node, macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:main
      - run: npm run test:ui

  backend-mac:
    name: Backend lint and tests (Python, macOS)
    runs-on: macos-14
    env:
      # See the Windows backend job.
      FFMPEG_BIN: ${{ github.workspace }}/vendor/ffmpeg/ffmpeg
      FFPROBE_BIN: ${{ github.workspace }}/vendor/ffmpeg/ffprobe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run fetch:ffmpeg

      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest -q
        working-directory: backend

  package-mac:
    name: Packaging smoke test (macOS)
    runs-on: macos-14
    # Catches what the unit tests can't: a dependency that PyInstaller fails
    # to freeze, a missing file in the package, a frozen backend that dies
    # on startup. Builds the real (ad-hoc signed, never published) app with
    # the same vendored binaries a release ships, then starts its bundled
    # backend and waits for /health.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run setup:backend
      # The same fetch list as `dist` and release.mjs (package.json).
      - run: npm run fetch:vendor
      - run: npm run build
      - run: npm run build:backend
      - run: npx electron-builder --publish never

      - name: Start the frozen backend and check /health
        env:
          # The backend refuses requests without the per-launch token main.js
          # normally generates; any value works as long as the request echoes it.
          DESKRECAP_API_TOKEN: ci-smoke-token
          PORT: "8765"
          GRAPH_INDEXING_DISABLED: "1"
        run: |
          RES="$PWD/release/mac-arm64/DeskRecap.app/Contents/Resources"
          for f in backend/app-backend ffmpeg/ffmpeg ffmpeg/ffprobe llama/llama-server speaker/speaker-embedding.onnx; do
            [ -s "$RES/$f" ] || { echo "missing from the package: $RES/$f"; exit 1; }
          done
          # The backend only starts llama-server once its 2.5 GB model is
          # downloaded, so /health never would: prove the bundled binary's
          # dylibs, signature and arch load from inside the app.
          "$RES/llama/llama-server" --version
          export APP_DATA_DIR="$RUNNER_TEMP/deskrecap-appdata"
          export FFMPEG_BIN="$RES/ffmpeg/ffmpeg" FFPROBE_BIN="$RES/ffmpeg/ffprobe"
          export LLAMA_SERVER_BIN="$RES/llama/llama-server" SPEAKER_MODEL_PATH="$RES/speaker/speaker-embedding.onnx"
          mkdir -p "$APP_DATA_DIR"
          "$RES/backend/app-backend" > backend.log 2>&1 &
          PID=$!
          for i in $(seq 1 90); do
            if curl -fsS -m 2 -H "X-DeskRecap-Token: $DESKRECAP_API_TOKEN" "http://127.0.0.1:$PORT/health"; then
              echo
              echo "frozen backend healthy after ~${i}s"
              STATUS=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$PORT/health")
              # available:true needs both the packaged model and a frozen sherpa_onnx.
              SPEAKER=$(curl -sS -m 5 -H "X-DeskRecap-Token: $DESKRECAP_API_TOKEN" "http://127.0.0.1:$PORT/speaker-profiles" || true)
              kill $PID
              if [ "$STATUS" != "401" ]; then echo "expected 401 without the token, got $STATUS"; exit 1; fi
              case "$SPEAKER" in
                *'"available":true'*) ;;
                *) echo "speaker ID unavailable in the package: $SPEAKER"; cat backend.log; exit 1 ;;
              esac
              exit 0
            fi
            if ! kill -0 $PID 2>/dev/null; then echo "frozen backend exited:"; cat backend.log; exit 1; fi
            sleep 1
          done
          echo "frozen backend never became healthy:"; cat backend.log
          kill $PID
          exit 1

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  frontend:
    name: Lint, build, and test (Node)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:main
      - run: npm run test:ui

  backend:
    name: Backend tests (Python)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # bin_paths.py resolves ffmpeg/ffprobe via PATH when FFMPEG_BIN/
      # FFPROBE_BIN aren't set (the dev-mode default) -- the vendored
      # binaries under vendor/ffmpeg are gitignored, so this runner has
      # neither on PATH without an explicit install. Without this,
      # ffprobe_ok() crashes with FileNotFoundError instead of the
      # graceful "invalid file" handling it has for every other failure
      # mode, failing test_process_rejects_invalid_screen_upload and
      # test_process_leaves_no_orphan_session_dir_on_rejected_upload.
      - run: choco install ffmpeg -y

      - run: pip install -r requirements.txt
      - run: python -m pytest -q
        working-directory: backend

  frontend-mac:
    name: Lint, build, and test (Node, macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:main
      - run: npm run test:ui

  backend-mac:
    name: Backend tests (Python, macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt
      - run: python -m pytest -q
        working-directory: backend

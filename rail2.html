<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Rail</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body { height: 100%; margin:0; padding:0; background:transparent; overflow: hidden;}
      .rail {
        height: 100%; width: 100%;
        box-sizing: border-box;
        overflow-x: hidden; overflow-y: hidden;
        border-radius: 999px;
        background: rgba(23, 23, 23, 0.9);
        border: 2px solid rgba(145, 145, 145, 0.3);
        display: flex; flex-direction: column; align-items: center; gap: 12px;
        padding: 16px 0;
        -webkit-app-region: no-drag; user-select: none; color: #000;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      }
      .circle { height:40px; width:40px; border-radius:999px; border:2px solid #ffffff; background:#ef4444; }
      .btn { height:40px; width:40px; border-radius:8px; border:2px solid #000; background:rgba(145, 145, 145, 0.3); display:grid; place-items:center; }
      .divider { width:42px; height:1px; background: rgba(145, 145, 145, 0.3); }
      .pause { display:flex; gap:4px; }
      .pause div { height:20px; width:8px; background:#000; }
      .status { margin-top:auto; height:10px; width:10px; border-radius:999px; background:#9ca3af; border:1px solid #000; }
    </style>
  </head>
  <body>
    <div class="rail">
      <div class="circle"></div>
      <div class="divider"></div>
      <div class="btn"><div class="pause"><div></div><div></div></div></div>
      <div class="btn">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="#000"><path d="M8 5v14l11-7z"/></svg>
      </div>
      <span class="status"></span>
    </div>
  </body>
</html>
